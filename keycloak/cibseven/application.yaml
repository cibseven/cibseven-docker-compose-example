# =============================================================================
# CIB seven Run 3.0.0 – overrides for Keycloak
#
#   Login (webclient):   SSO redirect to Keycloak (OAuth2UserProvider)
#   /engine-rest:        Spring Security resource server, only Keycloak JWTs (--oauth2)
#   Users and groups:    cibseven-keycloak plugin, READ-ONLY, via the Keycloak admin API
#
# Loaded via SPRING_CONFIG_ADDITIONAL_LOCATION on top of
# /camunda/configuration/production.yml and takes precedence over it.
# No secrets in this file – every ${...} comes from the environment
# (docker-compose.yml -> .env).
#
# Two Keycloak URLs:
#   KEYCLOAK_PUBLIC_URL    reachable from the browser (login redirect, logout)
#   KEYCLOAK_INTERNAL_URL  reachable from the cibseven container (token, JWKS, userinfo, admin API)
# The issuer in every token is always the public URL (KC_HOSTNAME in Keycloak).
# =============================================================================

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys are loaded internally; with issuer-uri also set, Spring only validates the
          # "iss" claim (no discovery call against the public URL).
          jwk-set-uri: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
          issuer-uri: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}
          # /engine-rest only accepts tokens with this audience
          # (audience mapper "engine-rest-audience" in the realm).
          audiences:
            - cibseven-engine-rest
          # Claim that becomes the CIB seven user id (= Keycloak username, matches the plugin)
          principal-claim-name: preferred_username

# cibseven-keycloak identity provider plugin (jar mounted into configuration/userlib).
# Read-only: users and groups are only managed in Keycloak.
# https://github.com/cibseven-community-hub/cibseven-keycloak
plugin:
  identity:
    keycloak:
      keycloakIssuerUrl: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}
      keycloakAdminUrl: ${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}
      # Service account client with the realm-management roles query-users, view-users, query-groups
      clientId: ${CIBSEVEN_IDENTITY_CLIENT_ID}
      clientSecret: ${CIBSEVEN_IDENTITY_CLIENT_SECRET}
      # User id = Keycloak username (same as preferred_username in the token)
      useUsernameAsCamundaUserId: true
      # Group id = group path without leading "/", e.g. "camunda-admin", "accounting"
      useGroupPathAsCamundaGroupId: true
      # Admin rights are granted by camunda.bpm.run.admin-auth below, not by the plugin
      # (the plugin's administratorGroupName would also work, but must exist at startup).
      cacheEnabled: true
      maxCacheSize: 500
      cacheExpirationTimeoutMin: 5

camunda:
  bpm:
    # Built-in OAuth2 identity provider OFF – it is writable (DB-backed) and only knows the
    # current token. Users/groups come from the cibseven-keycloak plugin instead.
    oauth2:
      identity-provider:
        enabled: false
    run:
      # Invoice example (needs --example). Deploys the invoice process and starts instances.
      # The identity service is read-only, so the example creates no demo users, groups or
      # authorizations.
      example:
        enabled: true
      # Run's own basic/JWT authentication for /engine-rest MUST be off with --oauth2,
      # otherwise it rejects the Keycloak tokens. Spring Security protects the API instead.
      auth:
        enabled: false
      # Grants all permissions to the Keycloak group "camunda-admin" on engine start.
      admin-auth:
        enabled: true
        administrator-group-name: camunda-admin
        # Needed by the invoice example only: at first start it completes one of its demo tasks
        # as user id "mary" (no groups) and relies on a user authorization that its demo-data step
        # only creates for a writable identity service. There is NO user "mary" in Keycloak; this
        # only grants permissions to the user id. Without it CIB seven fails with a
        # NullPointerException in @PostDeploy. See README, explicit decisions E3.
        administrator-user-name: mary
    # Default task filter: created on engine start if no filter with this name exists yet.
    # Empty query = every task the user is allowed to read. production.yml (unlike default.yml)
    # doesn't create it. Visible to camunda-admin via admin-auth; other users need a
    # READ authorization on the filter, see README "Default task filter".
    filter:
      create: All tasks
    authorization:
      enabled: true

cibseven:
  webclient:
    # Modeler (BPMN/DMN/forms in the webclient). Off by default and not set by production.yml
    # (default.yml and the WildFly webclient switch it on). Its tables are created by the engine
    # (webclientExtensionsEnabled: true in production.yml).
    modeler:
      enabled: true
      templates:
        paths:
          # Bundled connector templates (e.g. AI agent) inside the jars on the classpath
          - "classpath*:element-templates/*.json"
          # Own element templates: configuration/element-templates/ in the container
          - "file:configuration/element-templates/*.json"
    user:
      provider: org.cibseven.webapp.auth.OAuth2UserProvider
    sso:
      active: true
      endpoints:
        # Browser redirects -> public URL
        authorization: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
        endSession: ${KEYCLOAK_PUBLIC_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/logout
        # Server-to-server -> internal URL
        token: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
        jwks: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
        user: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
        revocation: ${KEYCLOAK_INTERNAL_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/revoke
      clientId: ${CIBSEVEN_OIDC_CLIENT_ID}
      clientSecret: ${CIBSEVEN_OIDC_CLIENT_SECRET}
      scopes: openid profile email
      userIdProperty: preferred_username
      userNameProperty: name
      # Forward the Keycloak access token to /engine-rest (required: it is protected by Spring Security)
      accessTokenToEngineRest: true
